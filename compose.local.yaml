name: onebite-local

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: onebite
      POSTGRES_USER: onebite
      POSTGRES_PASSWORD: local-dev-postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "local-dev-redis-password"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=local-dev-redis-password redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai:
    build:
      context: ../one-bite-ai
      dockerfile: dockerfile
    environment:
      GEMINI_API_KEY: ${ONEBITE_GEMINI_API_KEY:-local-disabled}
      GEMINI_MODEL: ${ONEBITE_GEMINI_MODEL:-local-disabled}
    expose:
      - "8081"

  backend:
    build:
      context: ../spaghetti-be
      dockerfile: dockerfile
    environment:
      GOOGLE_CLIENT_ID: local-placeholder
      GOOGLE_CLIENT_SECRET: local-placeholder
      GOOGLE_REDIRECT_URI: http://localhost:3000/login/oauth
      DB_URI: jdbc:postgresql://postgres:5432/onebite
      DB_USERNAME: onebite
      DB_PASSWORD: local-dev-postgres-password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASS: local-dev-redis-password
      JWT_SECRET: local-dev-only-jwt-secret-change-me-before-deploying-1234567890
      AI_SERVER_URL: http://ai:8081
      AI_API_KEY: local-disabled
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: ../one-bite-fe
      dockerfile: dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: local-placeholder
        NEXT_PUBLIC_FRONTEND_URL: http://localhost:3000
        NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/onboarding').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
