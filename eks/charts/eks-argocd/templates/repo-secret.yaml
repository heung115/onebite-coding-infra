# ArgoCD 저장소 자격증명 (read-only deploy key argocd-eks-readonly).
# 키는 Git/values 에 두지 않고 Secrets Manager(onebite-argocd-repo)에서 받는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-tmp-onebite-gitops
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onebite-aws
  target:
    name: repo-tmp-onebite-gitops
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: {{ .Values.repoURL }}
        sshPrivateKey: '{{ "{{ .sshPrivateKey }}" }}'
  data:
    - secretKey: sshPrivateKey
      remoteRef:
        key: onebite-argocd-repo
