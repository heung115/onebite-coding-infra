# 홈서버 ClusterSecretStore(onebite-local, kubernetes provider)의 EKS 버전.
# 자격증명은 external-secrets 파드의 Pod Identity (Terraform aws_eks_pod_identity_association.eso)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onebite-aws
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
