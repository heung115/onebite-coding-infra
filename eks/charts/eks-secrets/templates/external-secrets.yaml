{{- range $env := .Values.envs }}
---
# redis 차트 values/redis.yaml 의 existingSecret: redis-secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-secret
  namespace: {{ $env }}
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: onebite-aws
  target:
    name: redis-secret
  dataFrom:
    - extract:
        key: onebite-redis
---
# postgresql 차트 values-eks/postgresql.yaml 의 existingSecret (password, postgres-password)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-auth
  namespace: {{ $env }}
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: onebite-aws
  target:
    name: postgresql-auth
  dataFrom:
    - extract:
        key: onebite-postgresql
---
# backend 차트의 envFrom secretRef: <release>-secret (ai-backend-<env>-secret)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-backend-{{ $env }}-secret
  namespace: {{ $env }}
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: onebite-aws
  target:
    name: ai-backend-{{ $env }}-secret
  dataFrom:
    - extract:
        key: onebite-ai-backend
{{- end }}
