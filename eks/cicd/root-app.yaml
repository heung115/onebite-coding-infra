apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onebite-cicd-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:heung115/tmp-onebite-gitops.git
    targetRevision: eks
    path: eks/cicd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
