# ArgoCD (단일 노드 홈서버용 최소 구성)
# - Dex(SSO), notifications 는 이번 측정 범위 밖이라 끔
# - 외부 노출 없음: UI 는 kubectl port-forward 로만 접근
# - reconciliation 주기는 차트 기본값(120s + jitter 60s) 그대로 두고 측정한다
global:
    domain: argocd.local

configs:
    params:
        server.insecure: true

dex:
    enabled: false

notifications:
    enabled: false

server:
    service:
        type: ClusterIP
