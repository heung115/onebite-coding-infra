apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: phase3-spot
spec:
  instanceProfile: onebite-eks-measure-karpenter-node
  amiFamily: AL2023
  amiSelectorTerms:
    - id: __EXPERIMENT_AMI_ID__
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: onebite-eks-measure
        kubernetes.io/role/elb: "1"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: onebite-eks-measure
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 30Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  tags:
    Project: onebite
    Temporary: "true"
    measure-pool: experiment
    measure-experiment: __EXPERIMENT_TAG__
    karpenter.sh/discovery: onebite-eks-measure
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: phase3-spot
spec:
  template:
    metadata:
      labels:
        measure-pool: experiment
        measure-experiment: phase3-spot
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: phase3-spot
      taints:
        - key: measure/only
          value: experiment
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: kubernetes.io/os
          operator: In
          values: [linux]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: [c, m, r]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gte
          values: ["7"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: [large, xlarge]
        - key: topology.kubernetes.io/zone
          operator: In
          values: [__EXPERIMENT_AZS__]
  limits:
    cpu: "32"
  disruption:
    # This budget limits voluntary drift/consolidation only. Spot interruption handling remains enabled.
    budgets:
      - nodes: "0"
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1h
