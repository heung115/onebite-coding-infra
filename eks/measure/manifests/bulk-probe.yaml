apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulk-probe
  namespace: measure
  labels:
    app: bulk-probe
spec:
  replicas: 0
  selector:
    matchLabels:
      app: bulk-probe
  template:
    metadata:
      labels:
        app: bulk-probe
    spec:
      nodeSelector:
        measure-pool: experiment
      tolerations:
        - key: measure/only
          operator: Equal
          value: experiment
          effect: NoSchedule
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
