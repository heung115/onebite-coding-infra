# EKS 차이만 덮어쓴다 (원본: values/redis.yaml, existingSecret: redis-secret 은 그대로)
# - redis-secret 은 Secrets Manager(onebite-redis) → ExternalSecret 이 만든다
# - 이미지: 같은 태그의 bitnamilegacy
global:
    security:
        allowInsecureImages: true
    defaultStorageClass: gp3

image:
    repository: bitnamilegacy/redis
    tag: 7.4.2-debian-12-r6
