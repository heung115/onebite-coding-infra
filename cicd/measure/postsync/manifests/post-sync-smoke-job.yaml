apiVersion: batch/v1
kind: Job
metadata:
  name: argocd-postsync-smoke-20260930
  namespace: dev-back
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 30
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-postsync-smoke-20260930
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: curl
          image: curlimages/curl:8.12.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              printf 'run_id=%s\nurl=%s\n' "$RUN_ID" "$SMOKE_URL"
              curl --fail --silent --show-error --max-time 5 --output /dev/null --write-out 'http_code=%{http_code}\n' "$SMOKE_URL"
              printf 'SMOKE_TEST_RESULT=success\n'
          envFrom:
            - configMapRef:
                name: argocd-postsync-smoke-20260930
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
