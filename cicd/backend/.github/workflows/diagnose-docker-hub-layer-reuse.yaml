name: Diagnose Docker Hub layer reuse

on:
  workflow_dispatch:
    inputs:
      path:
        description: Push through the local Docker daemon or push directly with Buildx
        required: true
        type: choice
        options:
          - load-push
          - buildx-push
        default: load-push
      reference_tag:
        description: Existing B2 experimental tag whose manifest/layers are checked
        required: true
        type: string
        default: ci-b2-measure-runner-37130143762-warm-pulse-25

permissions:
  contents: read

concurrency:
  group: diagnose-docker-hub-layer-reuse-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: Registry layer reuse (${{ inputs.path }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout personal measurement commit
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Gradle User Home cache
        uses: gradle/actions/setup-gradle@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: heung115
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install packet capture utility when needed
        run: |
          if ! command -v tcpdump >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y tcpdump
          fi

      - name: Set up docker-container Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Diagnose registry blob existence and push behavior
        env:
          IMAGE_REPO: heung115/spaghetti-be
          IMAGE_TAG: ci-b2-registry-diagnose-${{ github.run_id }}-${{ inputs.path }}
          REFERENCE_TAG: ${{ inputs.reference_tag }}
          PUSH_PATH: ${{ inputs.path }}
          BUILDER: ${{ steps.buildx.outputs.name }}
          DOCKER_USERNAME: heung115
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          EXPECTED_DEPENDENCIES_DIGEST: sha256:2eb1e23efc9357f789958473886c1bd03af5bd997b85f88b005b07d2e8cd3e7d
        run: python3 .github/scripts/diagnose-docker-hub-layer-reuse.py

      - name: Upload registry, packet capture, and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-b2-registry-diagnose-${{ github.run_id }}-${{ inputs.path }}
          path: measure-output/ci-b2-registry-diagnose-${{ github.run_id }}-${{ inputs.path }}/
          if-no-files-found: error
          retention-days: 30
