# 로컬(홈서버) 전용 시크릿 저장소: 같은 클러스터의 onebite-secrets 네임스페이스.
# EKS 에서는 provider 를 aws(SecretsManager) 로 바꾸면 ExternalSecret 은 그대로 쓴다.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
    name: onebite-local
spec:
    provider:
        kubernetes:
            remoteNamespace: onebite-secrets
            server:
                caProvider:
                    type: ConfigMap
                    name: kube-root-ca.crt
                    key: ca.crt
                    namespace: onebite-secrets
            auth:
                serviceAccount:
                    name: eso-reader
                    namespace: onebite-secrets
