# 앱 시크릿은 Git 에 두지 않는다. 클러스터 안의 원천 Secret(onebite-secrets/backend-dev-front)을
# External Secrets 가 읽어 backend-dev-front-secret 으로 만든다. EKS 이전 시 SecretStore 만 AWS Secrets Manager 로 교체.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    name: backend-dev-front-secret
    namespace: dev-front
spec:
    refreshInterval: 1h
    secretStoreRef:
        kind: ClusterSecretStore
        name: onebite-local
    target:
        name: backend-dev-front-secret
        creationPolicy: Merge  # 기존 Helm Secret 을 그대로 두고 값만 관리 (무중단 이전)
    dataFrom:
        - extract:
              key: backend-dev-front
