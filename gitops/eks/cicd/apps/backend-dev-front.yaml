apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cicd-backend-dev-front
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: git@github.com:heung115/tmp-onebite-gitops.git
      targetRevision: eks
      path: charts/backend
      helm:
        releaseName: backend-dev-front
        valueFiles:
          - values.yaml
          - $cicd/eks/cicd/values/backend-dev-front.yaml
    - repoURL: git@github.com:heung115/tmp-onebite-gitops.git
      targetRevision: eks
      ref: cicd
    - repoURL: git@github.com:heung115/tmp-onebite-gitops.git
      targetRevision: eks
      path: eks/cicd/resources/dev-front
  destination:
    server: https://kubernetes.default.svc
    namespace: dev-front
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
