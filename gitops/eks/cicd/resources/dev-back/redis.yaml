apiVersion: v1
kind: Service
metadata:
  name: backend-dev-back-redis
  namespace: dev-back
  labels:
    app.kubernetes.io/instance: backend-dev-back-redis
    app.kubernetes.io/name: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: backend-dev-back-redis
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-dev-back-redis
  namespace: dev-back
  labels:
    app.kubernetes.io/instance: backend-dev-back-redis
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: backend-dev-back-redis
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: backend-dev-back-redis
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - exec redis-server --save "" --appendonly no --requirepass "$REDIS_PASS"
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASS
              valueFrom:
                secretKeyRef:
                  name: backend-dev-back-secret
                  key: REDIS_PASS
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "redis-cli --no-auth-warning -a \"$REDIS_PASS\" ping"]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "redis-cli --no-auth-warning -a \"$REDIS_PASS\" ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "redis-cli --no-auth-warning -a \"$REDIS_PASS\" ping"]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
