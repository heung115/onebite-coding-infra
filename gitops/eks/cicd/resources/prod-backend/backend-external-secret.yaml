apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-prod-secret
  namespace: prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onebite-aws
  target:
    name: backend-prod-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: backend-prod
