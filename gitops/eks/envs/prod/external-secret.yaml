# EKS: 홈서버 envs/prod/external-secret.yaml 과 같고 저장소만 AWS Secrets Manager(onebite-aws).
# Secrets Manager 의 backend-prod 를 읽어 backend-prod-secret 을 만든다.
# EKS 에는 기존 Helm Secret 이 없으므로 Owner 로 직접 만든다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    name: backend-prod-secret
    namespace: prod
spec:
    refreshInterval: 1h
    secretStoreRef:
        kind: ClusterSecretStore
        name: onebite-aws
    target:
        name: backend-prod-secret
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: backend-prod
