  #   {{- $key := $map.name | upper | replace "-" "_" }}
  #   {{- $envStr = printf "%s%s=%s\n" $envStr $key $map.value }}
  #   {{- end }}
  #   {{ $envStr | b64enc }}
  # {{- end }}