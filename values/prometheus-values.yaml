# prometheus-values.yaml

# ——————————————————————————————————————————————
# 1. Grafana 완전 비활성화
# ——————————————————————————————————————————————
grafana:
    enabled: false # 기존에 쓰시던 설정 그대로

# ——————————————————————————————————————————————
# 2. Prometheus 서버 설정 조정
# ——————————————————————————————————————————————
prometheus:
    prometheusSpec:
        # scrape 간격 전역 설정 (Pod 단위 override 도 가능)
        scrapeInterval: 30s # 디폴트 15s → 30s
        evaluationInterval: 5m # 룰 평가 주기, 디폴트 1m → 5m

        # TSDB retention(보관 기간)
        retention: 7d # 디폴트 15d → 7d

        # 리소스 요청·제한 (여기도 꼭 넣어주세요)
        resources:
            requests:
                cpu: 200m
                memory: 300Mi
            limits:
                cpu: 800m
                memory: 1Gi

        # replicas를 1로 낮춰서 Prometheus 서버 복제본 수 줄이기
        replicas: 1

# ——————————————————————————————————————————————
# 3. Alertmanager 끄기 (필요 없으면)
# ——————————————————————————————————————————————
alertmanager:
    enabled: false

# ——————————————————————————————————————————————
# 4. 불필요한 Exporter/Component 제거
#    (예: kube-state-metrics, prometheus-adapter 등)
# ——————————————————————————————————————————————
kubeStateMetrics:
    enabled: false

prometheusOperator:
    enabled: true # operator는 살아있어야 helm 관리 가능

# prometheus-adapter 예시
prometheusAdapter:
    enabled: false

# ——————————————————————————————————————————————
# 5. scrape_configs 별도 조정이 필요하다면
#    global 대신 job 단위로도 가능
# ——————————————————————————————————————————————
additionalScrapeConfigs: |
    # 예시 : node-exporter만 60초로 조정
    - job_name: 'kubernetes-nodes'
      scrape_interval: 60s
      kubernetes_sd_configs:
        - role: node
